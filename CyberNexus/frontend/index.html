<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Bot - Terminal</title>
    <!-- Modern tech fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        
        <!-- Top Terminal Bar -->
        <header class="terminal-header">
            <div class="header-left">
                <span class="pulse-indicator"></span>
                <span class="system-title">CYBER_BOT // SYSTEM_ONLINE</span>
            </div>
            <div class="header-right">
                <span class="badge">v2.0</span>
                <button id="reset-btn" class="reset-btn" title="New Session">Clear [ESC]</button>
            </div>
        </header>

        <!-- Main Content Area -->
        <main class="terminal-main">
            
            <!-- 1. HERO VIEW (Initial Welcome Screen) -->
            <div id="hero-view" class="hero-view">
                
                <!-- Revolving 3D Cyber Earth + Blinking Hacker Avatar -->
                <div class="animation-wrapper">
                    <!-- Spinning 3D Wireframe Cyber Globe Canvas -->
                    <canvas id="globe-canvas" width="220" height="220"></canvas>
                    
                    <!-- Hacker Avatar with Blinking Neon Eyes inside the globe -->
                    <div class="hacker-avatar">
                        <svg class="hacker-svg" viewBox="0 0 100 100">
                            <!-- Hood outline -->
                            <path d="M50 8 C 30 8 18 25 18 55 C 18 78 28 92 50 94 C 72 92 82 78 82 55 C 82 25 70 8 50 8 Z" 
                                  fill="#0a120c" stroke="#10b981" stroke-width="2.5"/>
                            <!-- Inner shadow face -->
                            <path d="M50 20 C 35 20 28 35 28 58 C 28 72 36 82 50 84 C 64 82 72 72 72 58 C 72 35 65 20 50 20 Z" 
                                  fill="#040805"/>
                            <!-- Blinking Neon Eyes -->
                            <g class="hacker-eyes">
                                <ellipse class="eye left-eye" cx="41" cy="52" rx="4.5" ry="3"/>
                                <ellipse class="eye right-eye" cx="59" cy="52" rx="4.5" ry="3"/>
                            </g>
                        </svg>
                    </div>
                </div>

                <h1 class="hero-title">&gt; CYBER_BOT</h1>
                <p class="hero-subtitle">Cybersecurity Intelligence Engine</p>

                <!-- Quick Prompt Chips -->
                <div class="quick-prompts">
                    <span class="prompts-label">Quick Queries:</span>
                    <div class="chips-container">
                        <button class="chip" data-query="what is dns">DNS</button>
                        <button class="chip" data-query="compare tcp and udp">TCP vs UDP</button>
                        <button class="chip" data-query="what is phishing">Phishing</button>
                        <button class="chip" data-query="what is firewall">Firewall</button>
                        <button class="chip" data-query="what does grep do">Linux: grep</button>
                    </div>
                </div>

                <div class="input-hint">Type a query below to initiate session...</div>
            </div>

            <!-- 2. CHAT VIEW (Active Conversation) -->
            <div id="chat-view" class="chat-view hidden">
                <div class="messages-list" id="messages-list">
                    <!-- Dynamic Messages Inserted Here -->
                </div>
            </div>

        </main>

        <!-- Bottom Input Bar -->
        <footer class="terminal-footer">
            <form id="chat-form" class="chat-form">
                <div class="input-container">
                    <span class="cli-arrow">&gt;</span>
                    <input type="text" id="user-input" class="cli-input" placeholder="Enter term or command (e.g. 'what is dns', 'compare tcp and udp')..." autocomplete="off">
                    <button type="submit" class="cli-submit-btn" title="Send (Enter)">
                        <span>SEND</span>
                        <svg class="send-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                            <path d="M5 12h14M12 5l7 7-7 7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </button>
                </div>
            </form>
            <div class="footer-status">
                <span class="sec-status">ENCRYPTED // LOCALHOST</span>
                <span class="keys-hint">Press <kbd>Enter</kbd> to execute</span>
            </div>
        </footer>

    </div>

    <script src="app.js"></script>
</body>
</html>
